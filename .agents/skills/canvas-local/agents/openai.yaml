interface:
  display_name: "画布本地发布"
  short_description: "按站点参数构建验证 New_infinite-canvas 的 linux/amd64 镜像"
  default_prompt: "使用 $canvas-local 为 New_infinite-canvas 指定公开发布域名检查源码契约，按 profile 中独立的 API 上游地址构建并验证本机 linux/amd64 画布镜像；发布到 image.gptch.cloud 时保持固定 API 上游为 https://gptch.cloud；每个公开域名独立构建，只有在明确授权后才按现场蓝绿拓扑发布到 newapi。"
