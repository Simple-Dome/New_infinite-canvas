services:
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-cherryAI}
        VITE_APP_LOGO: ${VITE_APP_LOGO-🍒}
        VITE_HOME_TITLE: ${VITE_HOME_TITLE-}
        VITE_API_ALLOWED_ORIGINS: ${VITE_API_ALLOWED_ORIGINS-https://artworkers.online,https://tovyn.xyz,https://gptch.cloud}
    volumes:
      - ./runtime-config:/etc/infinite-canvas:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
